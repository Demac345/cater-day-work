<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>44 Mafia - Categories</title>
</head>
<body>
    <nav id="nav-bar">
        <h1 class="logo">44 <span>mafia</span></h1>
        <div id="nav">
            <a href="index.html">Home</a>
            <input type="text" class="search-input" placeholder="Search for designs...">
            <a href="categories.html">Categories</a>
            <button id="cart-btn" class="cart-container" aria-label="Shopping Cart">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff">
                    <path d="M280-80q-33 0-56.5-23.5T200-160q0-33 23.5-56.5T280-240q33 0 56.5 23.5T360-160q0 33-23.5 56.5T280-80Zm400 0q-33 0-56.5-23.5T600-160q0-33 23.5-56.5T680-240q33 0 56.5 23.5T760-160q0 33-23.5 56.5T680-80ZM246-720l96 200h280l110-200H246Zm-38-80h590q23 0 35 20.5t1 41.5L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68-39.5t-2-78.5l54-98-144-304H40v-80h130l38 80Zm134 280h280-280Z"/>
                </svg>
                <span id="cart-count">0</span>
            </button>
        </div>
        <div id="but">
            <button class="btn btn-outline">Get Started</button>
            <a href="sign-up.html" class="btn btn-primary">Sign Up</a>
        </div>
    </nav>

    <section id="cat-section">
        <h2>Explore Designs</h2>
        <div id="cat">
            <!-- Product 1 -->
            <div class="catig" data-id="1" data-name="Design One" data-price="15000">
                <img src="images/first.JPG" alt="Design 1">
                <div class="product-info">
                    <h3>Design One</h3>
                    <p class="price">₦15,000</p>
                    
                    <!-- Options Row: Color & Size -->
                    <div class="product-options">
                        <div class="option-group">
                            <label for="color-1">Color:</label>
                            <select class="option-select color-select" id="color-1">
                                <option value="Black" selected>Black</option>
                                <option value="White">White</option>
                            </select>
                        </div>

                        <div class="option-group">
                            <label for="size-1">Size:</label>
                            <select class="option-select size-select" id="size-1">
                                <option value="S">S</option>
                                <option value="M" selected>M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="XXL">XXL</option>
                            </select>
                        </div>
                    </div>

                    <!-- Quantity Control -->
                    <div class="quantity-control">
                        <button class="qty-btn decrement">-</button>
                        <input type="number" class="qty-input" value="1" min="1">
                        <button class="qty-btn increment">+</button>
                    </div>

                    <button class="btn btn-primary add-to-cart-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="catig" data-id="2" data-name="Design Two" data-price="18000">
                <img src="images/second.JPG" alt="Design 2">
                <div class="product-info">
                    <h3>Design Two</h3>
                    <p class="price">₦18,000</p>
                    
                    <!-- Options Row: Color & Size -->
                    <div class="product-options">
                        <div class="option-group">
                            <label for="color-2">Color:</label>
                            <select class="option-select color-select" id="color-2">
                                <option value="Black" selected>Black</option>
                                <option value="White">White</option>
                            </select>
                        </div>

                        <div class="option-group">
                            <label for="size-2">Size:</label>
                            <select class="option-select size-select" id="size-2">
                                <option value="S">S</option>
                                <option value="M" selected>M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="XXL">XXL</option>
                            </select>
                        </div>
                    </div>

                    <!-- Quantity Control -->
                    <div class="quantity-control">
                        <button class="qty-btn decrement">-</button>
                        <input type="number" class="qty-input" value="1" min="1">
                        <button class="qty-btn increment">+</button>
                    </div>

                    <button class="btn btn-primary add-to-cart-btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Your Shopping Cart</h2>
            <div id="cart-items-container"></div>
            <div class="cart-summary">
                <h3>Total: ₦<span id="cart-total">0</span></h3>
                <button id="checkout-btn" class="btn btn-primary">Checkout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
